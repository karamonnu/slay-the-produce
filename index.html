<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slay the Produce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1b1830;--panel:#29243f;--line:#4a4166;--ink:#f6efe0;--dim:#b7adc9;--red:#e03050;--gold:#ffd040;--green:#7ad050;--blue:#6aa8ff;--purple:#b07ae0}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DotGothic16",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;padding:8px 8px 28px}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
button{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:6px;min-height:44px;padding:6px 10px;cursor:pointer;box-shadow:0 3px 0 #0006}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0006}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.big{background:var(--red);border-color:#ff7090;font-size:19px;width:100%}
h1{font-size:34px;line-height:1.05;margin:6px 0;text-align:center;font-weight:400}
h2{font-size:21px;margin:8px 0 6px;font-weight:400}
.sub{color:var(--dim);font-size:13px}
#hud{display:none;gap:6px 8px;align-items:center;flex-wrap:wrap;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:6px;font-size:14px}
#hud.on{display:flex}
#hud .dk{min-height:30px;padding:0 8px;font-size:13px;box-shadow:none}
.bar{position:relative;height:16px;background:#120f22;border:2px solid #000;border-radius:3px;overflow:hidden;flex:1 1 110px}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .25s}
.bar b{position:relative;display:block;text-align:center;font-size:12px;line-height:12px;font-weight:400;text-shadow:1px 1px 0 #000}
.gold{color:var(--gold);white-space:nowrap}
.rel{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.ri{width:30px;height:30px;min-height:30px;padding:0;font-size:15px;background:#3b2f58;border-color:var(--gold);color:var(--gold);box-shadow:none}
.ri.bo{background:#5a1838;border-color:#ff6080;color:#ffb0c0}.ri.sr,.dri.sr{background:#1e4a5a;border-color:#7ad0f0;color:#bff0ff}
.k-event{background:#1e5a5a;color:#bff0ff}.k-srelic{background:#1e4a5a;color:#bff0ff}
.path{display:flex;gap:3px;margin:4px 0 8px}
.path span{flex:1;text-align:center;font-size:12px;padding:3px 0;border-radius:4px;background:#120f22;border:2px solid var(--line);color:var(--dim)}
.path .done{background:#3b2f58;color:var(--ink)}
.path .now{border-color:var(--gold);color:var(--gold)}
#stage{position:relative;height:238px;border:3px solid #000;border-radius:8px;overflow:hidden;
 background:repeating-linear-gradient(0deg,#3d6a2c 0 10px,#33592a 10px 20px) bottom/100% 30% no-repeat,radial-gradient(circle at 84% 16%,#ffe9a0 0 12px,transparent 13px),linear-gradient(#2a2252,#6a3c6c 66%,#b0605a 70%)}
#stage.a2{background:repeating-linear-gradient(90deg,#2a4a5a 0 3px,transparent 3px 40px),repeating-linear-gradient(0deg,#2e5a3a 0 10px,#264d32 10px 20px) bottom/100% 30% no-repeat,linear-gradient(#0e1a30,#1e3a50 66%,#3a6070 70%)}
#stage.a3{background:repeating-linear-gradient(0deg,#4a2a3a 0 10px,#3c2230 10px 20px) bottom/100% 30% no-repeat,radial-gradient(circle at 84% 16%,#ff8080 0 12px,transparent 13px),linear-gradient(#140c22,#4a1838 66%,#80303a 70%)}
.ent{position:absolute;transition:transform .12s}
#pl{left:7%;bottom:8px}
#en{right:6%;bottom:22px}
.shadow{width:70%;height:9px;margin:-5px auto 0;background:#0005;border-radius:50%}
.ebox,.pbox{position:absolute;top:6px;background:#120f22d8;border:2px solid #000;border-radius:6px;padding:3px 6px;font-size:13px}
.ebox{right:6px;left:44%}.pbox{left:6px;width:40%}
.intent{display:inline-block;margin-top:3px;background:var(--ink);color:#1b1830;border:2px solid #000;border-radius:6px;padding:0 6px;font-size:13px}
.st{display:flex;gap:3px;flex-wrap:wrap;margin-top:3px}
.st em{font-style:normal;font-size:12px;padding:0 4px;border-radius:3px;background:#3b2f58}
.st .b{background:#2c4f86}.st .p{background:#4f7a2a}.st .v{background:#8a2a5a}.st .w{background:#6a4a8a}.st .s{background:#8a3020}.st .z{background:#2a7a7a}.st .x{background:#6a5a20}.st .bb{background:#d07090}.st .bd{background:#404060}.st .dm{background:#200810;color:#ff6080}
.st em{cursor:pointer}.intent{cursor:pointer}
#elog{position:absolute;left:0;right:0;bottom:0;text-align:center;font-size:13px;background:#000a;padding:1px 4px;color:var(--gold)}
.fx{position:absolute;z-index:5;font-size:22px;pointer-events:none;text-shadow:2px 2px 0 #000;animation:up .9s forwards;white-space:nowrap}
.fx.dmg{color:#fff}.fx.crit{color:var(--gold);font-size:28px}.fx.heal{color:var(--green)}.fx.blk{color:var(--blue)}.fx.miss{color:#ccc}.fx.buf{color:#ffa040}.fx.deb{color:var(--purple)}
@keyframes up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-44px);opacity:0}}
.hit{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-6px);filter:brightness(3)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.lp{transform:translateX(26px)}.le{transform:translateX(-26px)}
.ctl{display:flex;align-items:center;gap:8px;margin:8px 0 0}
.orb{flex:none;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe890,#e0a020 60%,#8a5a10);border:3px solid #000;display:grid;place-items:center;font-size:18px;color:#1b1830}
.pile{font-size:13px;color:var(--dim);line-height:1.3}
.ctl .end{margin-left:auto;background:#2a5a3a;border-color:#5ab070}
#hand{display:flex;justify-content:center;align-items:flex-end;padding:18px 2px 4px;min-height:142px}
.cd{--tc:#c83040;position:relative;flex:none;width:var(--cw,76px);height:116px;border:2px solid #000;border-radius:7px;background:linear-gradient(var(--tc) 0 34px,#f6efe0 34px);color:#1b1830;padding:5px 4px 4px;display:flex;flex-direction:column;gap:2px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 3px 0 #0008;transition:transform .12s,box-shadow .12s}
.cd.t-s{--tc:#3a70c0}.cd.t-p{--tc:#7a48b0}.cd.t-c{--tc:#3a1a2a;background:linear-gradient(var(--tc) 0 34px,#d8c8d8 34px)}
.cd.r-u{outline:2px solid #6aa8ff;outline-offset:-5px}.cd.r-r{outline:2px solid var(--gold);outline-offset:-5px}
.cd .co{position:absolute;left:-7px;top:-9px;width:24px;height:24px;border-radius:50%;background:var(--gold);border:2px solid #000;display:grid;place-items:center;font-size:14px;line-height:1}
.cd .nm{font-size:11.5px;line-height:1.12;text-align:center;color:#fff;text-shadow:1px 1px 0 #000;height:2.3em;display:grid;place-items:center;padding-left:12px;font-size:11px}
.cd .ty{font-size:10px;text-align:center;color:#6a607a}
.cd .ds{font-size:11px;line-height:1.25;flex:1;display:grid;place-items:center;text-align:center}
.cd .ds b{font-weight:400;color:#c02040}
.cd.ready{box-shadow:0 0 0 3px var(--gold),0 10px 16px #000a}
.cd.no .co{background:#888}
.cd.lift{z-index:3}
.cd.pickme{animation:pk 1s infinite}@keyframes pk{50%{box-shadow:0 0 0 3px var(--gold),0 3px 0 #0008}}
.cd.pick{outline:3px solid var(--gold);outline-offset:1px;transform:translateY(-4px)}
.cd.r-f{outline:2px dashed #ff9ad0;outline-offset:-5px}.cd.fz .ds{font-size:9px;line-height:1.15;overflow:hidden;align-items:start}.cd.fz .ds i{font-style:normal;color:#b0306a}.grid3 .cd.fz{height:auto;min-height:156px}.grid3 .cd.fz .ds{font-size:11px;overflow:visible}#modal .huge.fz{height:auto;min-height:250px}#modal .huge.fz .ds{font-size:13px;overflow:visible}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 8px;padding-top:8px}
.grid3 .cd{width:100%;height:156px}.grid3 .cd .nm{font-size:13px}.grid3 .cd .ds{font-size:12.5px}
.grid3 .cd{background:linear-gradient(var(--tc) 0 38px,#f6efe0 38px)}
.sbtn{background:none;border:0;box-shadow:none;padding:0;display:flex;flex-direction:column;gap:4px;align-items:stretch}
.sbtn .price{text-align:center}
.cards{display:grid;gap:8px}
.card{display:flex;gap:10px;align-items:center;text-align:left;padding:10px;width:100%}
.card .ic{flex:none;width:50px;height:50px;display:grid;place-items:center;border-radius:6px;font-size:24px;border:2px solid #000}
.card .tx{flex:1}
.card .tx b{display:block;font-weight:400;font-size:17px}
.card .tx span{color:var(--dim);font-size:13px;line-height:1.35;display:block}
.k-battle{background:#5a2a3a}.k-elite{background:#8a2030;color:var(--gold)}.k-rest{background:#2a5a3a}.k-shop{background:#6a5a20}.k-boss{background:#2a0a20;color:#ff6080}.k-relic{background:#3b2f58;color:var(--gold)}.k-brelic{background:#5a1838;color:#ffb0c0}
.price{color:var(--gold);white-space:nowrap;font-size:15px}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:10px;margin:8px 0}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row .nm{flex:1}
.row .v{width:84px;text-align:right;white-space:nowrap}
.row .v small{color:var(--green)}
.row button{width:44px;padding:0;font-size:20px}
.pts{font-size:20px;color:var(--gold);text-align:center;margin:4px 0}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:6px 0 10px;padding:14px 0 0;border-radius:8px;background:linear-gradient(#2a2252,#6a3c6c);border:3px solid #000}
.lineup{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0}
.legend{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px;font-size:13px}
.legend div{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px}
.mini{display:flex;flex-wrap:wrap;gap:4px;font-size:13px}
.mini span{background:#120f22;border:1px solid var(--line);border-radius:4px;padding:1px 6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:90vw;background:#000d;border:2px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:14px;z-index:30;display:none}
#modal{position:fixed;inset:0;background:#000c;z-index:20;display:none;overflow:auto;padding:20px 12px}
#modal.on{display:block}
#modal .box{max-width:480px;margin:0 auto;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px}
#modal .cd.huge{width:170px;height:250px;margin:10px auto 14px;background:linear-gradient(var(--tc) 0 56px,#f6efe0 56px)}
#modal .huge .nm{font-size:17px}#modal .huge .ds{font-size:16px}#modal .huge .ty{font-size:13px}#modal .huge .co{width:36px;height:36px;font-size:20px}
.gl{font-size:14px;margin:4px 0}.gl b{font-weight:400;color:var(--gold)}
.deckg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px 6px;padding-top:8px}
.deckg .cd{width:100%}
.tabs{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:-14px;background:var(--panel);padding:6px 0;z-index:2;border-bottom:2px solid var(--line)}.tabs button{min-height:40px;padding:4px 10px;box-shadow:none}.tabs button.on{border-color:var(--gold);color:var(--gold)}
.dri{flex:none;width:34px;height:34px;display:grid;place-items:center;border:2px solid var(--gold);border-radius:6px;background:#3b2f58;color:var(--gold)}.dri.bo{background:#5a1838;border-color:#ff6080;color:#ffb0c0}
.mvl{font-size:12.5px;color:var(--dim);line-height:1.4}.tag{font-size:12px;color:var(--gold)}
.hero.farm{background:repeating-linear-gradient(90deg,transparent 0 22px,#6a4a2a 22px 25px) bottom/100% 30px no-repeat,linear-gradient(#3a2a4a,#8a5a4a 62%,#5a3a20 62%)}.hero.innbg{background:radial-gradient(circle at 18% 22%,#ffd070 0 8px,#ffb04033 9px 40px,transparent 41px),repeating-linear-gradient(90deg,#6a4020 0 26px,#5a3418 26px 29px)}
.center{text-align:center}.gap{height:8px}
@media (prefers-reduced-motion:reduce){.fx{animation-duration:.01s}.hit{animation:none}.ent,.cd{transition:none}}
</style>
</head>
<body>
<div id="app"><div id="hud"></div><div id="main"></div></div>
<div id="modal"></div>
<div id="toast"></div>

function genOpts(f){
 if(f==1)return['battle'];if(f==10)return['boss'];if(f==9)return['rest','shop'];
 const w={battle:10,event:8,rest:4,elite:4,shop:4},out=[];
 while(out.length<3){const keys=Object.keys(w);let r=Math.random()*keys.reduce((s,k)=>s+w[k],0);for(const k of keys){r-=w[k];if(r<=0){out.push(k);break}}}
 return out;
}

function mkEnemy(kind,boost=1){
 const A=ACTS[P.act-1],base={blk:0,str:0,poi:0,vul:0,weak:0,dz:0,x:0,mi:-1,art:0,armor:0,sleep:0,rg:0,dr:0,pumpB:0};
 if(kind=='boss'){const b=BS[bossOf()];return{...b,...base,maxHp:b.hp,sc:1,boss:1}}
 const b=kind=='elite'?EL[pickN(A.el,1)[0]]:EN[pickN(A.nm,1)[0]];
 const f=Math.max(1,P.floor),sc=1+.07*(f-1),hp=Math.round(b.hp*sc);
 const hp2=Math.round(hp*boost);return{...b,...base,hp:hp2,maxHp:hp2,atk:b.atk*(1+.05*(f-1))*boost,sc,elite:kind=='elite'};
}
const dblRate=e=>e.last?1:e.boss?.5:(e.elite?[.25,.33,.5]:[.1,.2,.3])[P.act-1];
function pickIntent(e){const one=()=>{let i;if(e.boss)i=(e.mi+1)%e.mv.length;else{do{i=rnd(0,e.mv.length-1)}while(i==e.mi&&e.mv.length>1&&!e.mv[i].a)}e.mi=i;return e.mv[i]};
 const m1=one();e.intent=[m1];
 if(Math.random()<dblRate(e)){const c=e.mv.filter(m=>m!==m1&&!(m1.a&&m.a));if(!c.length)return;
  let m2=c[rnd(0,c.length-1)];if(e.boss)for(let k=1;k<=e.mv.length;k++){const x=e.mv[(e.mi+k)%e.mv.length];if(c.includes(x)){m2=x;break}}

  main.innerHTML=`<h2>${t}</h2><div class="pts">ポイント 残り ${left}</div><div class="panel">${ST.map(([k,n,v,c,u,cap,note])=>{const now=P[k]+add[k]*v,canAdd=left>=c&&now<cap;
   return `<div class="row"><span class="nm">${n}<br><span class="sub">${c}ptで +${v}${u}${note?'・'+note:''}${cap<999?`（上限${cap}${u}）`:''}</span></span><span class="v">${fmt(P[k])}${u}${add[k]?` <small>+${fmt(add[k]*v)}</small>`:''}</span><button data-a="m" data-v="${k}" ${add[k]?'':'disabled'} aria-label="${n}を減らす">−</button><button data-a="p" data-v="${k}" ${canAdd?'':'disabled'} aria-label="${n}を増やす">＋</button></div>`}).join('')}</div>
  <p class="sub">使わなかったポイントは持ち越せます（マップ画面からも振れます）</p>
  <button class="big" data-a="ok">${left?`決定（${left}pt持ち越し）`:'決定'}</button>`};
 H={p:k=>{add[k]++;draw()},m:k=>{add[k]--;draw()},ok:()=>{ST.forEach(([k,,v,c,,cap])=>{P[k]=Math.min(cap,Math.round((P[k]+add[k]*v)*10)/10);P.pts-=add[k]*c;if(k=='maxHp')P.hp+=add[k]*v;if(k=='crit')P.cd+=add[k]*5});next()}};
 draw();
}

  {l:'祝福をもらう',d:'HP30回復',f:()=>evEnd('きらきら～',`HPが${hpUp(30)}回復した。`)}]},
 {t:'野菜の亡霊',d:'倒した野菜怪人たちの怨念が集まって、強敵の姿になった！',o:[
  {l:'戦う',d:'強敵と戦う（勝てば強敵と同じ報酬）',f:()=>startBattle('elite')},
  {l:'逃げる',d:'HP6を失う',f:()=>{hpDown(6);evEnd('逃げ切った','HPを6失った。')}}]}
];
function showEvent(ev){
 updHud();
 if(!ev){let pool=EV.filter(e=>!P.seen.includes(e.t));if(!pool.length){P.seen=[];pool=EV}ev=pickN(pool,1)[0];P.seen.push(ev.t)}
 showEvent.cur=()=>showEvent(ev);
 H={ch:i=>{const o=ev.o[+i];if(o.ok&&!o.ok())return;o.f()}};
 main.innerHTML=pathBar()+`<h2>？ ${ev.t}</h2>${ev.sp?`<div class="hero">${img(ev.sp,4)}</div>`:''}<div class="panel">${ev.d}</div>
 <div class="cards">${ev.o.map((o,i)=>`<button class="card" data-a="ch" data-v="${i}" ${o.ok&&!o.ok()?'disabled':''}><span class="ic k-event">${i+1}</span><span class="tx"><b>${o.l}</b><span>${o.d}${o.l=='飛び越える'?`（今の成功率${jumpRate()}%）`:''}</span></span></button>`).join('')}</div>`;
}
function showDup(){
 H={dup:i=>{const id=P.deck[+i];P.deck.push(id);evEnd('技を磨いた',`「${CD[id].n}」を1枚複製した。`)},back:()=>showEvent.cur()};
 main.innerHTML=`<h2>複製するカードを選ぶ</h2><div class="deckg">${P.deck.map((id,i)=>cardHTML(id,`data-a="dup" data-v="${i}" role="button" tabindex="0"`)).join('')}</div><div class="gap"></div><button data-a="back" style="width:100%">やめる</button>`;
}

function showRest(){
 updHud();const h=Math.round(P.maxHp*.35);
 H={rest:()=>{P.hp=Math.min(P.maxHp,P.hp+h);showMsg('ぐっすり休んだ',`HPが回復した（最大${h}）`,showMap)},fuse:()=>showFuse(0,showRest),train:()=>{P.pts+=2;showStat('鍛錬 +2',showMap)}};
 main.innerHTML=pathBar()+`<h2>休憩ステージ</h2><p class="sub">畑のすみの小屋でひと休み。どれか1つを選べます（ポイント ${P.pts}）</p><div class="cards">
 <button class="card" data-a="rest"><span class="ic k-rest">休</span><span class="tx"><b>休む</b><span>HPを${h}回復</span></span></button>
 <button class="card" data-a="fuse" ${P.pts<2||P.deck.length<2||P.hp<=10?'disabled':''}><span class="ic k-elite">合</span><span class="tx"><b>カード合成</b><span>ポイント2とHP10を使って2枚を1枚に合成。ランダムでエンチャントが1つつく${P.pts<2?'（ポイントが足りない）':P.hp<=10?'（HPが足りない）':''}</span></span></button>
 <button class="card" data-a="train"><span class="ic k-elite">鍛</span><span class="tx"><b>鍛錬</b><span>ステータスポイント+2</span></span></button></div>`;
}
let fseq=0;
function fuseName(a,b){const x=Array.from(a),y=Array.from(b);return x.slice(0,Math.ceil(x.length/2)).join('')+y.slice(Math.floor(y.length/2)).join('')}
function makeFused(a,b){const A=CD[a],Bc=CD[b],ne=pickN(Object.keys(ENCH),1)[0];
 const base=[...(A.base||[a]),...(Bc.base||[b])],ench=[...(A.ench||[]),...(Bc.ench||[]),ne];
 const t=base.some(x=>CD[x].t=='p')?'p':base.some(x=>CD[x].t=='a')?'a':'s';
 const id='f'+Date.now().toString(36)+(fseq++);
 CD[id]={n:fuseName(A.n,Bc.n),c:Math.max(0,Math.ceil((A.c+Bc.c)/2)-(ne=='cost'?1:0)),t,r:'f',base,ench,dm:(A.dm||1)*(Bc.dm||1)*(ne=='dmg'?1.2:1),ex:base.some(x=>CD[x].ex)?1:0,fused:1};
 return{id,ne}}
const fuseCost=(a,b)=>CD[a].fused||CD[b].fused?3:2;
function showFuse(free=0,back=showRest){
 let sel=[];
 const draw=()=>{const ok=sel.length==2,cost=free?0:ok?fuseCost(P.deck[sel[0]],P.deck[sel[1]]):sel.some(i=>CD[P.deck[i]].fused)?3:2;
  const A=ok&&CD[P.deck[sel[0]]],Bc=ok&&CD[P.deck[sel[1]]];
  main.innerHTML=pathBar()+`<h2>カード合成</h2><p class="sub">合成する2枚を選んでください（1枚目の名前の前半＋2枚目の名前の後半）。${free?'今回はポイント不要！':`消費：ポイント2（合成済みカードを含むと3）とHP10。所持ポイント ${P.pts}`}</p>
  ${ok?`<div class="panel">できるカード：<b style="font-weight:400;color:var(--gold)">${fuseName(A.n,Bc.n)}</b>　コスト${Math.ceil((A.c+Bc.c)/2)}（★エンチャントでコスト-1の可能性あり）<br><span class="sub">2枚の効果を両方持ち、ランダムなエンチャントが1つつく。必要ポイント ${cost}</span></div>`:''}
  <div class="deckg">${P.deck.map((id,i)=>cardHTML(id,`data-a="sel" data-v="${i}" role="button" tabindex="0"`,sel.includes(i)?'pick':'')).join('')}</div><div class="gap"></div>
  <button class="big" data-a="ok" ${ok&&P.pts>=cost?'':'disabled'}>${ok&&P.pts<cost?'ポイントが足りない':'合成する'}</button><div class="gap"></div><button data-a="back" style="width:100%">やめる</button>`};
 H={sel:v=>{const i=+v;if(CD[P.deck[i]].t=='c'){toast('呪いカードは合成できない');return}sel=sel.includes(i)?sel.filter(x=>x!=i):sel.length<2?[...sel,i]:[sel[1],i];draw()},back,
  ok:()=>{const a=P.deck[sel[0]],b=P.deck[sel[1]],cost=free?0:fuseCost(a,b);if(P.pts<cost)return;if(!free){if(P.hp<=10){toast('HPが足りない');return}P.hp-=10}P.pts-=cost;let hh=0;if(has('sHeal')){hh=Math.min(rv('sHeal'),P.maxHp-P.hp);P.hp+=hh}
   const r=makeFused(a,b);[...sel].sort((x,y)=>y-x).forEach(i=>P.deck.splice(i,1));P.deck.push(r.id);updHud();
   H={ok:showMap};main.innerHTML=pathBar()+`<h2>合成成功！</h2><div class="grid3"><span></span>${cardHTML(r.id)}<span></span></div><div class="panel center">エンチャント「${ENCH[r.ne]}」がついた！<br>${hh?`王家の薬草袋でHPが${hh}回復した<br>`:''}<span class="sub">長押し不要：効果はカードに書いてあります</span></div><button class="big" data-a="ok">次へ</button>`}};
 draw();
}
const price=p=>has('card')?Math.round(p*(1-rv('card')/100)):p;
const CPR={c:[45,55],u:[70,82],r:[115,135]};
function showShop(fresh){
 updHud();
 if(fresh){const byR=r=>Object.keys(CD).filter(k=>CD[k].r==r);const cs=[...pickN(byR('c'),3),...pickN(byR('u'),1),...pickN(byR('r'),1)];
  shop={cards:cs.map(id=>({id,p:rnd(...CPR[CD[id].r]),sold:0})),relics:pickN(NORMAL_R.filter(r=>!P.relics.includes(r)),2).map(r=>({id:r,p:rnd(200,300),sold:0})),juice:0,seed:0,rm:0}}
 const items=[...shop.relics.map((r,i)=>({k:'r'+i,ic:RL[r.id].i,cls:'k-relic',n:RL[r.id].n,d:rd(r.id),p:price(r.p),sold:r.sold})),
  {k:'rm',ic:'捨',cls:'k-shop',n:'カード削除',d:has('chain')?'絆の鎖のせいで削除できない':'デッキからカードを1枚取り除く',p:price(P.rm),sold:shop.rm||has('chain')},
  {k:'juice',ic:'汁',cls:'k-rest',n:'トマトジュース',d:'HPを最大HPの20%回復',p:price(70),sold:shop.juice},
  {k:'seed',ic:'種',cls:'k-elite',n:'ステータスの種',d:'ステータスポイント+1',p:price(50),sold:shop.seed}];
 H={buyc:i=>{const it=shop.cards[+i],p=price(it.p);if(it.sold||P.gold<p)return;P.gold-=p;it.sold=1;P.deck.push(it.id);toast(CD[it.id].n+'を買った！');showShop()},
  buy:k=>{const it=items.find(x=>x.k==k);if(!it||it.sold||P.gold<it.p)return;P.gold-=it.p;
   if(k[0]=='r'&&k!='rm'){const r=shop.relics[+k.slice(1)];r.sold=1;giveRelic(r.id);toast(RL[r.id].n+'を手に入れた！');showShop()}
   else if(k=='rm'){shop.rm=1;showRemove(()=>{showShop()},()=>{P.gold+=it.p;shop.rm=0;showShop()},1)}
   else if(k=='juice'){shop.juice=1;P.hp=Math.min(P.maxHp,P.hp+Math.round(P.maxHp*.2));showShop()}
   else if(k=='seed'){shop.seed=1;P.pts+=1;showStat('ステータスの種 +1',()=>showShop())}},
  leave:showMap};
 main.innerHTML=pathBar()+`<h2>商人ステージ</h2><p class="sub">「いらっしゃい！野菜に負けない品ぞろえだよ」　所持金 <span class="gold">${P.gold}G</span></p>
 <div class="grid3">${shop.cards.map((c,i)=>`<button class="sbtn" data-a="buyc" data-v="${i}" ${c.sold||P.gold<price(c.p)?'disabled':''}>${cardHTML(c.id)}<span class="price">${c.sold?'売切':price(c.p)+'G'}</span></button>`).join('')}</div>
 <div class="gap"></div><div class="cards">${items.map(it=>`<button class="card" data-a="buy" data-v="${it.k}" ${it.sold||P.gold<it.p?'disabled':''}><span class="ic ${it.cls}">${it.ic}</span><span class="tx"><b>${it.n}</b><span>${it.d}</span></span><span class="price">${it.sold?'売切':it.p+'G'}</span></button>`).join('')}</div><div class="gap"></div><button class="big" data-a="leave">店を出る</button>`;
}

function showEnd(clear){
 updHud();H={again:title};
 main.innerHTML=`<div class="hero">${img('hero',5)}${clear?'':`<div style="padding-bottom:6px">${img(B&&B.e?B.e.s:'daikon',3)}</div>`}</div>
 <h1>${clear?'畑に平和が戻った！':'ゲームオーバー'}</h1>
 <p class="center">${clear?`${BS[P.last].n}をたおした！全3層クリア！`:`第${P.act}層 ステージ${P.floor}で力尽きた…`}</p>
 <div class="panel"><div class="mini"><span>攻撃 +${P.atk}</span><span>防御 +${P.def}</span><span>回避 ${P.eva}%</span><span>会心 ${P.crit}%</span><span>会心ダメ ${100+P.cd}%</span><span>抵抗 ${P.res}%</span><span>最大HP ${P.maxHp}</span><span>デッキ ${P.deck.length}枚</span></div><div class="gap"></div>
 <div class="sub">レリック：${P.relics.map(r=>RL[r].n).join(' / ')||'なし'}</div></div>
 <button class="big" data-a="again">タイトルへ</button>`;
}

function resetDrag(){if(!drag)return;clearTimeout(drag.t);drag.el.style.transform='';drag.el.classList.remove('ready','lift');drag=null}
main.addEventListener('pointerdown',ev=>{const el=ev.target.closest('#hand .cd[data-i]');if(el&&B&&B.picking){ev.preventDefault();const r=B.picking;B.picking=null;r(+el.dataset.i);return}if(!el||busy||!B)return;ev.preventDefault();try{el.setPointerCapture(ev.pointerId)}catch(_){}
 drag={el,i:+el.dataset.i,x:ev.clientX,y:ev.clientY,dy:0,moved:0};el.classList.add('lift');el.style.transform='translateY(-10px)';
 drag.t=setTimeout(()=>{if(drag&&!drag.moved){const id=B.hand[drag.i];resetDrag();showDetail(id)}},450)});
main.addEventListener('pointermove',ev=>{if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)>8||Math.abs(dy)>8){drag.moved=1;clearTimeout(drag.t)}
 drag.dy=dy;drag.el.style.transform=`translate(${dx*.4}px,${Math.min(-10,dy)}px) scale(${dy<-30?1.1:1})`;drag.el.classList.toggle('ready',dy<-70)});
main.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;resetDrag();if(d.dy<-70)play(d.i);else if(!d.moved)toast('上にスワイプで使用／長押しで詳細')});
main.addEventListener('pointercancel',resetDrag);
main.addEventListener('contextmenu',ev=>{if(ev.target.closest('.cd'))ev.preventDefault()});

title();
}

</script>
</body>
</html>
